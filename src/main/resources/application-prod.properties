# Production specific properties
# Use environment variables for sensitive data in production
spring.datasource.url=${DATABASE_URL_PROD}
spring.datasource.username=${DATABASE_USERNAME_PROD}
spring.datasource.password=${DATABASE_PASSWORD_PROD}
spring.jpa.hibernate.ddl-auto=validate # or none, if using Flyway/Liquibase
spring.jpa.show-sql=false
# CORS configuration for production frontend
app.cors.allowed-origins=https://your-production-frontend-url.com
# Ensure server port is configured via environment variable for production
server.port=${PORT:8080}

