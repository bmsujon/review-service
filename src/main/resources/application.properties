spring.application.name=reviewservice
# Server Configuration
# server.port=${PORT:8080} # Moved to profile-specific files

# CORS Configuration
# app.cors.allowed-origins=https://review-service-frontend.vercel.app,http://localhost:5173 # Moved to profile-specific files

# Datasource Configuration for PostgreSQL
# spring.datasource.url=${DATABASE_URL} # Moved to profile-specific files
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Use 'validate' or 'none' in production and manage schema with Flyway/Liquibase
# 'update' is convenient for development to let Hibernate create/update tables
# spring.jpa.hibernate.ddl-auto=update # Moved to profile-specific files
# spring.jpa.show-sql=true # Moved to profile-specific files
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Important for mapping Java camelCase (myField) to SQL snake_case (my_field) automatically
# This matches the SQL schema we generated (e.g., 'createdAt' in Java maps to 'created_at' in SQL)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# Ensure TIMESTAMPTZ is handled correctly (often default, but good to be aware)
# spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.threads.virtual.enabled=true

# Default active profile if none is specified
spring.profiles.active=dev
